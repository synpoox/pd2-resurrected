name: release
# The full build and the release 7z (issue #109). Runs only on the owner's self-hosted runner: it needs a D2R install,
# which never goes to GitHub (ADR 0007). Run it by hand (Actions > release > Run
# workflow). A green build publishes a GitHub release v<mod.json version>, marked Latest so the repo page shows it, with
# the 7z, release-manifest.json and SHA256SUMS (the toolkit's github_release.py --assets), which then merges it into the shared launcher feed, and keeps them as a workflow artifact too. The publish step needs the LAUNCHER_FEED_TOKEN secret. Runner setup: CONTRIBUTING.md.
# Two jobs, as the toolkit's template: "build" has a read-only token; only "publish" (needs build) may write.
on:
  workflow_dispatch:

# Least privilege by default; only the publish job may write (to create the release).
permissions:
  contents: read

# One release at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # the toolkit template's guard: a release is made from the default branch only
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, windows, pd2r]
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      MODKIT_CACHE: ${{ vars.D2R_TOOLKIT }}\d2r-data
      MODKIT_GAME: ${{ vars.D2R_GAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Version
        id: version
        run: |
          $v = (Get-Content mod.json -Raw | ConvertFrom-Json).version
          if (-not $v) { throw "no version in mod.json" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Pin the toolkit
        # the commit toolkit.version names, in its own worktree (tools/ci_toolkit.ps1): the runner's shared checkout is never moved
        run: powershell -ExecutionPolicy Bypass -File tools\ci_toolkit.ps1 -Main "${{ vars.D2R_TOOLKIT }}"
      - name: Python packages
        run: py -3 -m pip install --quiet --disable-pip-version-check numpy Pillow
      - name: Tool tests
        run: py -3 -m unittest discover -s tools/tests
      - name: Plugins
        run: powershell -ExecutionPolicy Bypass -File plugin\build.ps1
      - name: Companions and build
        run: |
          py -3 "$env:D2R_TOOLKIT\release\companions.py" fetch; if ($LASTEXITCODE) { throw "companions fetch failed" }
          py -3 -m modkit build . --no-validate; if ($LASTEXITCODE) { throw "modkit build failed" }
          py -3 tools/mirror_base_bank.py; if ($LASTEXITCODE) { throw "mirror_base_bank failed" }
      - name: Validation (known errors, #171; does not block the release)
        continue-on-error: true
        run: py -3 -m modkit validate .
      - name: Read the Cartographer pin
        id: cartographer
        run: |
          $pin = Get-Content tools/cartographer.pin | Where-Object { $_ -cmatch '^[0-9a-f]{40}$' } | Select-Object -First 1
          if (-not $pin) { throw "tools/cartographer.pin has no commit SHA" }
          "commit=$pin" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          repository: synpoox/d2r-tools
          ref: ${{ steps.cartographer.outputs.commit }}
          path: .cartographer
          submodules: true
          persist-credentials: false
      - name: Build Cartographer
        run: |
          cmake -S .cartographer/plugins/cartographer -B .cartographer/build -A x64
          if ($LASTEXITCODE) { throw "Cartographer configure failed" }
          cmake --build .cartographer/build --config Release --target cartographer
          if ($LASTEXITCODE) { throw "Cartographer build failed" }
      - name: Package
        env:
          CARTOGRAPHER_COMMIT: ${{ steps.cartographer.outputs.commit }}
          # a second D2R.exe (another build): with two exes each manifest entry is labelled from its own .build.info, not release.toml (#1796)
          EXTRA_GAME_EXE: ${{ vars.D2R_GAME_EXTRA_EXE }}
        run: |
          if (-not $env:EXTRA_GAME_EXE -or -not (Test-Path $env:EXTRA_GAME_EXE)) { throw "set the D2R_GAME_EXTRA_EXE variable to another build's D2R.exe (#1796)" }
          py -3 tools/release_precheck.py; if ($LASTEXITCODE) { throw "out/data holds retired converter output" }
          $dll = Join-Path $PWD ".cartographer/build/Release/cartographer.dll"
          powershell -ExecutionPolicy Bypass -File tools\check_cartographer.ps1 -Dll "$dll" -Commit "$env:CARTOGRAPHER_COMMIT" -Repo .cartographer
          if ($LASTEXITCODE) { throw "Cartographer DLL validation failed" }
          py -3 "$env:D2R_TOOLKIT\release\stage.py" --game "$env:MODKIT_GAME" --extra-game-exe "$env:EXTRA_GAME_EXE" --extra-plugin "$dll@d2r-tools $env:CARTOGRAPHER_COMMIT"
          if ($LASTEXITCODE) { throw "stage.py failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/*.7z
            dist/RELEASE_NOTES-*.md
            dist/release-manifest.json
            dist/feed.json
            dist/SHA256SUMS
            out/validation.md
          retention-days: 14

  publish:
    needs: build
    runs-on: [self-hosted, windows, pd2r]
    permissions:
      contents: write
    env:
      # --assets also merges into the shared feed in synpoox/resurrected-launcher once the release is public, so one token
      # covers both repos: a fine-grained PAT, Contents read/write on this repo and on resurrected-launcher.
      # If the feed merge fails after the release is public, rerun: github_release.py <v> --feed <dist>
      GH_TOKEN: ${{ secrets.LAUNCHER_FEED_TOKEN }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release-files
      - name: Pin the toolkit
        run: powershell -ExecutionPolicy Bypass -File tools\ci_toolkit.ps1 -Main "${{ vars.D2R_TOOLKIT }}"
      - name: GitHub release
        run: |
          $v = $env:VERSION
          if (-not $env:GH_TOKEN) { throw "set the LAUNCHER_FEED_TOKEN secret (contents: write on this repo and on synpoox/resurrected-launcher)" }
          # the tag must be new: gh would attach a release to an existing bare tag, maybe on another commit
          # Windows PowerShell 5.1 ends the step on a native command's stderr under 'Stop', and a new tag answers "Not Found"
          $ErrorActionPreference = 'Continue'
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/v$v" --silent 2>$null
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($code -eq 0) { throw "tag v$v already exists: bump mod.json's version to publish again" }
          $sums = Get-ChildItem release-files -Recurse -Filter SHA256SUMS | Select-Object -First 1
          if (-not $sums) { throw "no SHA256SUMS in the build artifact" }
          $d = $sums.DirectoryName
          # draft, upload the 7z + release-manifest.json + SHA256SUMS, verify, then public and Latest (the shared feed is not a release asset).
          # --skip-launcher-validation: the runner has no launcher validator build ($env:RESURRECTED_VALIDATE_RELEASE); the toolkit's own checks still run.
          # The release is made from this commit, as before.
          py -3 "$env:D2R_TOOLKIT\release\github_release.py" $v --assets $d --commit $env:GITHUB_SHA --skip-launcher-validation
          if ($LASTEXITCODE) { throw "github_release.py --assets failed (a failed run leaves a draft or, after public, an unmerged feed: see the GH_TOKEN comment)" }
