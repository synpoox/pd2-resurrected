name: release
# The full build and the release 7z (issue #109). Runs only on the owner's self-hosted runner: it needs the PD2 install
# in pd2-baseline.json and a D2R install, which never go to GitHub (ADR 0002). Run it by hand (Actions > release > Run
# workflow). A green build publishes a GitHub release v<mod.json version>, marked Latest so the repo page shows it, with
# the 7z and SHA256SUMS, and keeps them as a workflow artifact too. Runner setup: README.md.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: [self-hosted, windows, pd2r]
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ vars.D2R_TOOLKIT }}
      MODKIT_CACHE: ${{ vars.D2R_TOOLKIT }}\d2r-data
      MODKIT_GAME: ${{ vars.D2R_GAME }}
      D2R_TOOLKIT: ${{ vars.D2R_TOOLKIT }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Update the toolkit checkout
        run: git -C "${{ vars.D2R_TOOLKIT }}" pull -q --ff-only
        continue-on-error: true  # a dirty or diverged checkout, or another job's pull, must not fail the run
      - name: Python packages
        run: py -3 -m pip install --quiet --disable-pip-version-check numpy Pillow
      - name: Tool tests
        run: py -3 -m unittest discover -s tools/tests
      - name: Plugins
        run: powershell -ExecutionPolicy Bypass -File plugin\build.ps1
      - name: Merged data
        run: |
          py -3 tools/pd2_extract.py; if ($LASTEXITCODE) { throw "pd2_extract failed" }
          py -3 -m modkit fetch --prefix data/global/tiles/ --prefix data/hd/env/preset/ --prefix data/global/animdata.d2; if ($LASTEXITCODE) { throw "modkit fetch failed" }
          py -3 tools/pd2_merge.py; if ($LASTEXITCODE) { throw "pd2_merge failed" }
          py -3 tools/companions.py fetch; if ($LASTEXITCODE) { throw "companions fetch failed" }
          py -3 -m modkit build . --no-validate; if ($LASTEXITCODE) { throw "modkit build failed" }
      - name: Validation (known errors, #171; does not block the release)
        continue-on-error: true
        run: py -3 -m modkit validate .
      - name: Package
        run: py -3 tools/release.py --game "$env:MODKIT_GAME"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/*.7z
            dist/RELEASE_NOTES-*.md
            dist/release-manifest.json
            dist/SHA256SUMS
            out/validation.md
          retention-days: 14
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content mod.json -Raw | ConvertFrom-Json).version
          $files = @((Get-ChildItem dist\*.7z).FullName) + "dist\SHA256SUMS"
          # fails if the tag already has a release: bump mod.json's version to publish again
          gh release create "v$v" @files --target $env:GITHUB_SHA --title "PD2 Resurrected $v" --notes-file "dist\RELEASE_NOTES-$v.md" --latest
          if ($LASTEXITCODE) { throw "gh release create failed" }
