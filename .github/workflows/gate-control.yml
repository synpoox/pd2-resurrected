name: gate-control

# Close events for the gate (#897). They used to start gate.yml itself, whose job `if:` skipped them, and that left a
# skipped check run named table-diff on the PR head: main's ruleset requires table-diff and GitHub counts a skipped
# check as passing. The job here has another name, so no event but a real gate run ever produces a table-diff check.
#   closed (merged too): cancel the PR's in-flight gate run (#847).
on:
  pull_request:
    types: [closed]

jobs:
  control:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Cancel the PR's gate run
        shell: bash
        run: |
          run=$(gh run list --workflow gate.yml --event pull_request --commit "$HEAD" --limit 1 --json databaseId,status -q '.[0] | "\(.databaseId) \(.status)"')
          if [ -z "$run" ]; then echo "no gate run on $HEAD (docs-only change?)"; exit 0; fi
          id=${run% *}; status=${run#* }
          case "$status" in queued|in_progress|waiting|requested|pending) gh run cancel "$id"; echo "cancelled gate run $id";; esac
