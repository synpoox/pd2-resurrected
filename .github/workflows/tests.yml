name: tests

# Tool unit tests on CI's hosted runner; the committed tables in files/data are read directly (ADR 0007).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tools/tests -v
      - run: pip install ruff==0.17.5
      - run: ruff check tools
