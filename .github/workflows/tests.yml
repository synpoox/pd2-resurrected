name: tests

# Tool unit tests on synthetic fixtures only: CI has no PD2 data and never builds the mod (ADR 0002).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tools/tests -v
