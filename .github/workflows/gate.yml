name: gate

# The table-diff gate (tools/pd2_diff.py, #352) on every PR and push to main. It needs the PD2 install and D2R's tables,
# which never go to GitHub (ADR 0002), so it runs on the owner's self-hosted runner, as the release does; README.md has
# the runner setup. PRs from forks don't run here: the runner only builds this repository's own branches.
# Docs-only changes start no run (paths-ignore); closing or merging a PR cancels its in-flight run (#847).
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'changelog.d/**']
  pull_request:
    # labeled: coverage-drop-ok reruns the gate; closed (merged too) joins the PR's group to cancel its run, the job's if: skips it
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]
    paths-ignore: ['**/*.md', 'docs/**', 'changelog.d/**']

# One gate per PR: a push cancels the run on the old head (#801). push: one group per main commit (each uploads its
# baseline). A label other than coverage-drop-ok starts a run the job's if: skips: one group per run, so it can't
# cancel the PR's real gate. Otherwise one group per PR.
concurrency:
  group: gate-${{ github.event_name == 'push' && github.sha || (contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) && github.event.label.name != 'coverage-drop-ok') && format('skip-{0}', github.run_id) || github.event.pull_request.number }}
  cancel-in-progress: true

# The merge below takes a slot of the machine-wide semaphore agents' merges use (pd2_cache.Slots, PD2R_MERGE_SLOTS, #760,
# #801), so CI and agents share one cap and a gate merge that has to wait says so in its log. Set PD2R_MERGE_SLOTS in
# the runner's environment to the same value as the agents' (see pd2_cache.merge_slots for how to pick it).
jobs:
  table-diff:
    # another label (triage) does not rerun it, and a label on a merged or closed PR starts nothing (#801)
    if: >-
      github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.state == 'open' && !github.event.pull_request.merged
      && (!contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) || github.event.label.name == 'coverage-drop-ok'))
    runs-on: [self-hosted, windows, pd2r]
    permissions:
      contents: read
      actions: read  # gh run download of main's coverage-baseline artifact
    env:
      PYTHONPATH: ${{ vars.D2R_TOOLKIT }}
      MODKIT_CACHE: ${{ vars.D2R_TOOLKIT }}\d2r-data
      MODKIT_GAME: ${{ vars.D2R_GAME }}
    steps:
      - name: Drop cache junction
        run: if (Test-Path pd2-data) { cmd /c rmdir pd2-data }
        continue-on-error: true
      - uses: actions/checkout@v4
      - name: Update the toolkit checkout
        run: git -C "${{ vars.D2R_TOOLKIT }}" pull -q --ff-only
        continue-on-error: true  # a dirty or diverged checkout, or another job's pull, must not fail the run
      - name: Merged data
        run: |
          $cache = "C:\pd2r-cache\pd2-data"
          New-Item -ItemType Directory -Force $cache | Out-Null
          New-Item -ItemType Junction -Path pd2-data -Target $cache | Out-Null
          py -3 tools/pd2_extract.py --out $cache; if ($LASTEXITCODE) { throw "pd2_extract failed" }
          py -3 -m modkit fetch --prefix data/global/animdata.d2; if ($LASTEXITCODE) { throw "modkit fetch failed" }
          py -3 tools/pd2_merge.py; if ($LASTEXITCODE) { throw "pd2_merge failed" }
      - name: Table-diff gate
        run: py -3 tools/pd2_diff.py --scope alpha
      # #786: the merge/presets-hd.d/ stand-in lines (quarter rule, no empty line, no missing DT1); prints tiles renamed per map
      - name: Stand-in lines lint
        if: ${{ !cancelled() }}
        run: py -3 tools/pd2_presets_lint.py
      # LP3c (#672, #681): the no-game coverage report of the generated HD presets, uploaded as an artifact. A push to
      # main uploads its scores as the coverage-baseline artifact; a PR compares against the latest one (#723), so no
      # PR commits a baseline, and fails when a preset's wall, border or floor score drops more than
      # pd2_coverage.TOLERANCE points below it; a drop inside it passes and is listed as within tolerance (#800). The fidelity scores against legacy per edge type and floor (#732,
      # pd2_fidelity) ride along: fidelity-baseline.tsv in the same artifact, a drop per (map, type) fails the same way. The PR label coverage-drop-ok accepts an intended drop. Without main's
      # artifact it falls back to docs/coverage-baseline.tsv. It runs after the table-diff, so that result is already
      # in. Without model_lod_desc.bin it skips and passes.
      - name: HD preset coverage
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          DROP_OK: ${{ contains(github.event.pull_request.labels.*.name, 'coverage-drop-ok') }}
        run: |
          py -3 -m modkit fetch --prefix data/hd/model_lod_desc.bin
          if ($LASTEXITCODE) { "::warning::modkit fetch of model_lod_desc.bin failed: the coverage check may skip" }
          if ("${{ github.event_name }}" -eq "push") {
            $out = py -3 tools/pd2_coverage.py --commit ${{ github.sha }} --baseline coverage/baseline.tsv --write-baseline
          } else {
            $base = "docs/coverage-baseline.tsv"
            $run = gh run list --repo ${{ github.repository }} --workflow gate.yml --branch main --event push --status success --limit 1 --json databaseId -q '.[0].databaseId'
            if ($run) { gh run download $run --repo ${{ github.repository }} --name coverage-baseline --dir coverage/main-coverage }
            if (Test-Path coverage/main-coverage/baseline.tsv) {
              $base = "coverage/main-coverage/baseline.tsv"
              "Coverage compared with main's scores from run $run." | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            } else {
              "::warning::no coverage-baseline artifact from main: comparing with $base"
            }
            [string[]]$check = if ($env:DROP_OK -eq "true") { @() } else { @("--check") }
            if ($env:DROP_OK -eq "true") { "Label coverage-drop-ok: drops are reported, not failed." | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }
            $out = py -3 tools/pd2_coverage.py --commit ${{ github.sha }} --baseline $base @check
          }
          $code = $LASTEXITCODE
          $out
          if (Test-Path coverage/drops.md) {
            Get-Content coverage/drops.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
          if (Test-Path coverage/fidelity-changes.md) {
            Get-Content coverage/fidelity-changes.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
          if (Test-Path coverage/changes.md) {
            Get-Content coverage/changes.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          } elseif (-not (Test-Path coverage/report.md)) {
            "::warning::HD preset coverage did not run: $out"
            "HD preset coverage did not run: $out" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
          exit $code
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && github.event_name == 'push' }}
        continue-on-error: true
        with:
          name: coverage-baseline
          path: |
            coverage/baseline.tsv
            coverage/fidelity-baseline.tsv
            coverage/fidelity-tiles-baseline.tsv
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: hd-preset-coverage
          path: coverage/
          if-no-files-found: ignore
