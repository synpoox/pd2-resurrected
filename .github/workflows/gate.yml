name: gate

# The table-diff gate (tools/pd2_diff.py, #352) on every PR and push to main. It needs the PD2 install (its baseline tables)
# and D2R's tables, which never go to GitHub (ADR 0007; the mod's tables are the committed files/data), so it runs on the owner's self-hosted runner, as the release does; README.md has
# the runner setup. PRs from forks never reach the runner (it only builds this repository's own branches): their
# table-diff job runs on a hosted runner and fails at once (#901), because a skipped check counts as passing.
# Docs-only changes start no run (paths:), except the gate inputs docs/deviations.md.
# Only a real gate run may carry a check named table-diff (#897): main's ruleset requires it and GitHub counts a skipped
# check as passing, so no event may start a run of this workflow whose job is skipped. Close events go to
# gate-control.yml, which cancels the PR's gate run (#847) from a job with another name.
on:
  push:
    branches: [main]
    paths: ['**', '!**/*.md', '!docs/**', '!changelog.d/**', 'docs/deviations.md']
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['**', '!**/*.md', '!docs/**', '!changelog.d/**', 'docs/deviations.md']

# One gate per PR: a push cancels the run on the old head (#801). push: one group for main, so a newer main commit cancels
# the older one's run (#903).
concurrency:
  group: gate-${{ github.event_name == 'push' && 'main' || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  table-diff:
    # #901: the job never skips. A fork PR runs it on a hosted runner, where the first step fails it (a skipped
    # table-diff counts as passing, #897); every later step is skipped by that failure or by the FORK guard.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","windows","pd2r"]') }}
    permissions:
      contents: read
    env:
      FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      MODKIT_CACHE: ${{ vars.D2R_TOOLKIT }}\d2r-data
      MODKIT_GAME: ${{ vars.D2R_GAME }}
    steps:
      - name: Refuse fork PRs
        if: ${{ env.FORK == 'true' }}
        shell: bash
        run: |
          echo "::error::table-diff does not run for PRs from forks: the gate needs the owner's runner, which only builds this repository's branches. Push the branch to synpoox/pd2-resurrected and open the PR from there."
          exit 1
      - name: Drop cache junction
        if: ${{ env.FORK != 'true' }}
        run: if (Test-Path pd2-data) { cmd /c rmdir pd2-data }
        continue-on-error: true
      - uses: actions/checkout@v4
      - name: Pin the toolkit
        # the commit toolkit.version names, in its own worktree (tools/ci_toolkit.ps1): the runner's shared checkout is never moved
        run: powershell -ExecutionPolicy Bypass -File tools\ci_toolkit.ps1 -Main "${{ vars.D2R_TOOLKIT }}"
      - name: PD2 baseline
        run: |
          # one folder per baseline: extract() rmtrees a stale out (#1237)
          $root = "C:\pd2r-cache\pd2-extract"
          $hash = (Get-FileHash -Algorithm SHA256 pd2-baseline.json).Hash.Substring(0, 16).ToLower()
          $cache = "$root\$hash"
          New-Item -ItemType Directory -Force $cache | Out-Null
          (Get-Item $cache).LastWriteTime = Get-Date
          try { Get-ChildItem $root -Directory | Where-Object { $_.Name -match '^[0-9a-f]{16}$' -and $_.Name -ne $hash -and $_.LastWriteTime -lt (Get-Date).AddDays(-7) } | Remove-Item -Recurse -Force -ErrorAction Stop } catch { Write-Host "prune skipped: $_" }
          New-Item -ItemType Junction -Path pd2-data -Target $cache | Out-Null
          py -3 tools/pd2_extract.py --out $cache; if ($LASTEXITCODE) { throw "pd2_extract failed" }
          py -3 -m modkit fetch --prefix data/global/animdata.d2 --prefix data/hd/model_lod_desc.bin; if ($LASTEXITCODE) { throw "modkit fetch failed" }
      - name: Table-diff gate
        run: py -3 tools/pd2_diff.py --scope alpha
