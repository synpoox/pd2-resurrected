name: gate

# The table-diff gate (tools/pd2_diff.py, #352) on every PR and push to main. It needs the PD2 install and D2R's tables,
# which never go to GitHub (ADR 0002), so it runs on the owner's self-hosted runner, as the release does; README.md has
# the runner setup. PRs from forks don't run here: the runner only builds this repository's own branches.
# Docs-only changes start no run (paths:), except the gate inputs docs/deviations.md and docs/coverage-baseline.tsv; closing or merging a PR cancels its in-flight run (#847).
on:
  push:
    branches: [main]
    paths: ['**', '!**/*.md', '!docs/**', '!changelog.d/**', 'docs/deviations.md', 'docs/coverage-baseline.tsv']
  pull_request:
    # labeled: parity-drop-ok reruns the gate; closed (merged too) joins the PR's group to cancel its run, the job's if: skips it
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]
    paths: ['**', '!**/*.md', '!docs/**', '!changelog.d/**', 'docs/deviations.md', 'docs/coverage-baseline.tsv']

# One gate per PR: a push cancels the run on the old head (#801). push: one group per main commit (each uploads its
# baseline). A label other than parity-drop-ok starts a run the job's if: skips: one group per run, so it can't
# cancel the PR's real gate. Otherwise one group per PR.
concurrency:
  group: gate-${{ github.event_name == 'push' && github.sha || (contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) && github.event.label.name != 'parity-drop-ok') && format('skip-{0}', github.run_id) || github.event.pull_request.number }}
  cancel-in-progress: true

# The merge below takes a slot of the machine-wide semaphore agents' merges use (pd2_cache.Slots, PD2R_MERGE_SLOTS, #760,
# #801), so CI and agents share one cap and a gate merge that has to wait says so in its log. Set PD2R_MERGE_SLOTS in
# the runner's environment to the same value as the agents' (see pd2_cache.merge_slots for how to pick it).
jobs:
  table-diff:
    # another label (triage) does not rerun it, and a label on a merged or closed PR starts nothing (#801)
    if: >-
      github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.state == 'open' && !github.event.pull_request.merged
      && (!contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) || github.event.label.name == 'parity-drop-ok'))
    runs-on: [self-hosted, windows, pd2r]
    permissions:
      contents: read
      actions: read  # gh run download of main's coverage-baseline artifact
    env:
      PYTHONPATH: ${{ vars.D2R_TOOLKIT }}
      MODKIT_CACHE: ${{ vars.D2R_TOOLKIT }}\d2r-data
      MODKIT_GAME: ${{ vars.D2R_GAME }}
    steps:
      - name: Drop cache junction
        run: if (Test-Path pd2-data) { cmd /c rmdir pd2-data }
        continue-on-error: true
      - uses: actions/checkout@v4
      - name: Update the toolkit checkout
        run: git -C "${{ vars.D2R_TOOLKIT }}" pull -q --ff-only
        continue-on-error: true  # a dirty or diverged checkout, or another job's pull, must not fail the run
      - name: Merged data
        run: |
          $cache = "C:\pd2r-cache\pd2-data"
          New-Item -ItemType Directory -Force $cache | Out-Null
          New-Item -ItemType Junction -Path pd2-data -Target $cache | Out-Null
          py -3 tools/pd2_extract.py --out $cache; if ($LASTEXITCODE) { throw "pd2_extract failed" }
          py -3 -m modkit fetch --prefix data/global/animdata.d2; if ($LASTEXITCODE) { throw "modkit fetch failed" }
          # #820: replay the rules whose code and inputs are unchanged from the shared rule cache. A push to main keeps
          # new entries there and replays only main's own; a PR replays main's and keeps only in its scratch folder
          # (pd2_cache.Policy), so a buggy PR run cannot damage the entries main replays (same-repo PR code is trusted by this job's `if:`).
          $env:PD2R_CI_SCOPE = if ("${{ github.event_name }}" -eq "push") { "main" } else { "pr-${{ github.event.pull_request.number }}" }
          "PD2R_CI_SCOPE=$env:PD2R_CI_SCOPE" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV  # #854: the coverage step caches under the same scope
          py -3 tools/pd2_merge.py; if ($LASTEXITCODE) { throw "pd2_merge failed" }
      - name: Table-diff gate
        run: py -3 tools/pd2_diff.py --scope alpha
      # #786: the merge/presets-hd.d/ stand-in lines (quarter rule, no empty line, no missing DT1); prints tiles renamed per map
      - name: Stand-in lines lint
        if: ${{ !cancelled() }}
        run: py -3 tools/pd2_presets_lint.py
      # #839: a stale op in merge/presets-overrides.d/ (it matches nothing the generator makes) fails the PR
      - name: Preset overrides lint
        if: ${{ !cancelled() }}
        run: py -3 tools/pd2_overrides.py lint
      # LP3c (#672, #681): the no-game coverage report of the generated HD presets, uploaded as an artifact. Information
      # only since #838: it no longer fails a PR (the parity step below gates). A push to main uploads its scores as the
      # coverage-baseline artifact; a PR's report lists its changes against the latest one (#723; fall back to
      # docs/coverage-baseline.tsv). The fidelity scores against legacy per edge type and floor (#732, pd2_fidelity) ride
      # along: fidelity-baseline.tsv in the same artifact. Without model_lod_desc.bin it skips and passes.
      - name: HD preset coverage
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          py -3 -m modkit fetch --prefix data/hd/model_lod_desc.bin
          if ($LASTEXITCODE) { "::warning::modkit fetch of model_lod_desc.bin failed: the coverage check may skip" }
          if ("${{ github.event_name }}" -eq "push") {
            $out = py -3 tools/pd2_coverage.py --commit ${{ github.sha }} --baseline coverage/baseline.tsv --write-baseline
          } else {
            $base = "docs/coverage-baseline.tsv"
            $run = gh run list --repo ${{ github.repository }} --workflow gate.yml --branch main --event push --status success --limit 1 --json databaseId -q '.[0].databaseId'
            if ($run) { gh run download $run --repo ${{ github.repository }} --name coverage-baseline --dir coverage/main-coverage }
            if (Test-Path coverage/main-coverage/baseline.tsv) {
              $base = "coverage/main-coverage/baseline.tsv"
              "Coverage compared with main's scores from run $run." | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            } else {
              "::warning::no coverage-baseline artifact from main: comparing with $base"
            }
            $out = py -3 tools/pd2_coverage.py --commit ${{ github.sha }} --baseline $base
          }
          $out
          if (Test-Path coverage/drops.md) {
            Get-Content coverage/drops.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
          if (Test-Path coverage/fidelity-changes.md) {
            Get-Content coverage/fidelity-changes.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
          if (Test-Path coverage/changes.md) {
            Get-Content coverage/changes.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          } elseif (-not (Test-Path coverage/report.md)) {
            "::warning::HD preset coverage did not run: $out"
            "HD preset coverage did not run: $out" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
      # #891: hd-folder-types.tsv is made from the typing code and D2R's stock presets; fail when either changed since
      # it was written, so parity never scores with an old typing (fix: `py -3 tools/pd2_fidelity.py --write-votes`)
      - name: Folder types current
        if: ${{ !cancelled() }}
        run: py -3 tools/pd2_fidelity.py --check-votes
      # #838: the parity of each map (tools/pd2_parity.py) in the step summary. A push to main uploads parity-baseline.tsv
      # with the coverage baseline; a PR fails when a map's parity drops more than pd2_parity.TOLERANCE (2) points below it
      # (or a baselined map is no longer scored). The PR label parity-drop-ok accepts an intended drop. Without a
      # parity baseline from main (the first runs) it reports and passes.
      - name: HD:legacy parity
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          DROP_OK: ${{ contains(github.event.pull_request.labels.*.name, 'parity-drop-ok') }}
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            py -3 tools/pd2_parity.py --commit ${{ github.sha }} --write-baseline
          } else {
            [string[]]$check = if ($env:DROP_OK -eq "true") { @() } else { @("--check") }
            if ($env:DROP_OK -eq "true") { "Label parity-drop-ok: parity drops are reported, not failed." | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }
            # main's parity-baseline.tsv comes from the artifact the coverage step downloaded; always passed, so a main artifact
            # without the file yet is not downloaded a second time (the file is missing: the tool says "Not gated", #869)
            [string[]]$base = @("--baseline", "coverage/main-coverage/parity-baseline.tsv")
            py -3 tools/pd2_parity.py --commit ${{ github.sha }} @base @check
          }
          $code = $LASTEXITCODE
          if (Test-Path coverage/parity.md) {
            Get-Content coverage/parity.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
          exit $code
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && github.event_name == 'push' }}
        continue-on-error: true
        with:
          name: coverage-baseline
          path: |
            coverage/baseline.tsv
            coverage/parity-baseline.tsv
            coverage/fidelity-baseline.tsv
            coverage/fidelity-tiles-baseline.tsv
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: hd-preset-coverage
          path: coverage/
          if-no-files-found: ignore
