# Release config for d2rAI-toolkit's release/package_release.py, run by tools/release.py (keys: release/release.example.toml).
# Local 7z only: no download site or downloader yet, so [site] and [downloader] keep the toolkit's defaults.

[mod]
name = "PD2 Resurrected"
folder = "PD2Resurrected"
save_folder = "PD2Resurrected/"
website = "https://github.com/synpoox/pd2-resurrected"

[game]
version = "3.3.0"
build = "93847"
image_timestamp = "0x6ab3782c"

[d2rloader]
version = "1.3.1-beta"
url = "https://d2rloader.net/"

[launch]
default_mod = "PD2Resurrected"

[repos]
changelog = "CHANGELOG.md"
github = "synpoox/pd2-resurrected"

# Files players may edit: shipped_default in the launcher manifest, kept on Update and Repair.
[package]
preserve = ["d2rloader/config/d2rloader.toml", "d2rloader/config/filter.json"]

# Schema 3 release-manifest.json + feed.json for the Resurrected launcher (pass the tested D2R.exe with --game-exe).
[catalog]
product_id = "pd2r"
min_launcher_version = "0.1.0"
loader_versions = ["1.3.1-beta"]
required_settings = [{file = "d2rloader/config/d2rloader.toml", key = "d2rcore.save_format.mode", value = "extended"}]
upcoming = ["project-09", "project-forever"]
