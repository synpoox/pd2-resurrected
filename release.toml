# Release config for d2rAI-toolkit's release/stage.py and package_release.py (keys: release/release.example.toml).
# Local 7z only: no download site or downloader yet, so [site] and [downloader] keep the toolkit's defaults.

[mod]
name = "PD2 Resurrected"
folder = "PD2Resurrected"
save_folder = "PD2Resurrected/"
website = "https://github.com/synpoox/pd2-resurrected"

[game]
version = "3.4.0"        # the game the release is tested on; 3.3.0 (93847) runs the same build (#1509)
build = "95032"
image_timestamp = "0x6ab3782c"  # D2RLoader's engine image, the same on 3.3 and 3.4

[d2rloader]
version = "1.3.1-beta"
url = "https://d2rloader.net/"

[launch]
default_mod = "PD2Resurrected"

[repos]
changelog = "CHANGELOG.md"
fragments = "changelog.d"
github = "synpoox/pd2-resurrected"

[stage]
plugins = ["core-rules", "core-events", "core-ui"]
companions = true
item_type_check = false   # not checked before the toolkit either: a mod table's item type ids are its own
loader_from_game = true   # pin --game's official D2RLoader.exe in the catalog
notes = "docs/release-notes/{version}.md"   # condensed player notes (toolkit #311)

# Files players may edit: shipped_default in the launcher manifest, kept on Update and Repair.
[package]
preserve = ["d2rloader/config/d2rloader.toml", "d2rloader/config/filter.json"]

# Schema 3 release-manifest.json for the Resurrected launcher; each release is merged into the shared feed below (pass the tested D2R.exe with --game-exe).
[catalog]
product_id = "pd2r"
# The launcher reads this shared feed (the catalog release of the launcher repo).
feed_url = "https://github.com/synpoox/resurrected-launcher/releases/download/catalog/feed.json"
feed_repo = "synpoox/resurrected-launcher"
feed_tag = "catalog"
min_launcher_version = "0.1.0"
loader_versions = ["1.3.1-beta"]
required_settings = [{file = "d2rloader/config/d2rloader.toml", key = "d2rcore.save_format.mode", value = "extended"}]
save_breaking = false
upcoming = ["project-09", "project-forever"]
