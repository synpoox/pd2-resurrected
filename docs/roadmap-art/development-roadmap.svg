<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">PD2 Resurrected progression roadmap</title><desc id="desc">COMPLETE: Core gameplay. Classes, skills, itemization, crafting and corruption. PLAYABLE (BETA): Play with friends. TCP/IP co-op: campaign, mapping, bossing and trading. IN PROGRESS: Endgame expansion. Tier I–III maps, events, ubers and quality of life. IN PROGRESS: Gameplay &amp; Content Development. New features, missing mechanics, balance, stability and visuals. PLANNED: Warlock rework. Plan build rebalancing and new class skills. EXPLORATORY: Original PD2 maps. Explore restoring original PD2 map layouts in HD. EXPLORATORY: Hosted multiplayer. Explore project-hosted multiplayer servers.</desc>
